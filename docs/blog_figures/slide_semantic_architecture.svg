<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a5561"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="50" y="52" font-size="32" font-weight="700" fill="#14304a">A semantic layer for trustworthy AI-assisted investigations</text>
<text x="50" y="82" font-size="16" fill="#5b6b7a">Six layers separate what the domain means from where the data lives, so the model never has to guess a schema. Layers 2–5 are the semantic and data-access layers.</text>
<rect x="50" y="102" width="1080" height="44" rx="9" fill="#f6f8fa" stroke="#6b7280" stroke-width="1.4"/>
<text x="68" y="130" font-size="15" font-weight="700" fill="#1b2a3a">LLM</text>
<text x="124" y="130" font-size="14" fill="#4a5561">interprets the request and explains the result · never writes SQL, never sees a table or column</text>
<rect x="38" y="156" width="1104" height="562" rx="16" fill="#fbfcfd" stroke="#26313c" stroke-width="2.4"/>
<text x="58" y="183" font-size="20" font-weight="700" fill="#1b2a3a">OBDA</text>
<text x="142" y="183" font-size="13.5" fill="#4a5561">layers 1 to 5 are read together as one virtual knowledge graph · a question in business concepts is rewritten to SQL on the source</text>
<rect x="50" y="196" width="1080" height="94" rx="10" fill="#e8eef9" stroke="#2b5aa0" stroke-width="1.8"/>
<rect x="50" y="196" width="58" height="94" rx="10" fill="#2b5aa0"/><rect x="90" y="196" width="18" height="94" fill="#2b5aa0"/>
<text x="79" y="254.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="128" y="226" font-size="19" font-weight="700" fill="#1b2a3a">External Knowledge</text>
<text x="128" y="250" font-size="13.5" fill="#33414f">Published typologies, techniques, indicators and</text>
<text x="128" y="269" font-size="13.5" fill="#33414f">data-source definitions. Reused as published, not edited.</text>
<rect x="650" y="208" width="468" height="70" rx="7" fill="#ffffff" stroke="#2b5aa0" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="223" font-size="10" font-weight="700" fill="#2b5aa0" letter-spacing="1">EXAMPLE</text>
<text x="660" y="244" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">amx:T0039   (Circular Transactions)</text>
<text x="660" y="263" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  amlo:isIndicatedBy  amx:IND02191</text>
<path d="M79 291 L79 299" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="50" y="300" width="1080" height="94" rx="10" fill="#e4f2ea" stroke="#2e7d5b" stroke-width="1.8"/>
<rect x="50" y="300" width="58" height="94" rx="10" fill="#2e7d5b"/><rect x="90" y="300" width="18" height="94" fill="#2e7d5b"/>
<text x="79" y="358.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="128" y="330" font-size="19" font-weight="700" fill="#1b2a3a">AML Core Ontology</text>
<text x="128" y="354" font-size="13.5" fill="#33414f">Canonical AML concepts and relationships,</text>
<text x="128" y="373" font-size="13.5" fill="#33414f">independent of any database or typology.</text>
<rect x="650" y="312" width="468" height="70" rx="7" fill="#ffffff" stroke="#2e7d5b" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="327" font-size="10" font-weight="700" fill="#2e7d5b" letter-spacing="1">EXAMPLE</text>
<text x="660" y="348" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">amd:originator</text>
<text x="660" y="367" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  rdfs:domain amd:FundsTransfer ; rdfs:range amd:Account</text>
<path d="M79 395 L79 403" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="50" y="404" width="1080" height="94" rx="10" fill="#f7efdc" stroke="#b07a1a" stroke-width="1.8"/>
<rect x="50" y="404" width="58" height="94" rx="10" fill="#b07a1a"/><rect x="90" y="404" width="18" height="94" fill="#b07a1a"/>
<text x="79" y="462.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="128" y="434" font-size="19" font-weight="700" fill="#1b2a3a">Typology Requirements</text>
<text x="128" y="458" font-size="13.5" fill="#33414f">What each indicator needs, expressed only in</text>
<text x="128" y="477" font-size="13.5" fill="#33414f">concepts of the AML core ontology.</text>
<rect x="650" y="416" width="468" height="70" rx="7" fill="#ffffff" stroke="#b07a1a" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="431" font-size="10" font-weight="700" fill="#b07a1a" letter-spacing="1">EXAMPLE</text>
<text x="660" y="452" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">amx:IND02191  align:needsTerm</text>
<text x="660" y="471" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  amd:originator , amd:beneficiary , amd:transferTime</text>
<path d="M79 499 L79 507" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="50" y="508" width="1080" height="94" rx="10" fill="#ece8f6" stroke="#6a4fa3" stroke-width="1.8"/>
<rect x="50" y="508" width="58" height="94" rx="10" fill="#6a4fa3"/><rect x="90" y="508" width="18" height="94" fill="#6a4fa3"/>
<text x="79" y="566.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="128" y="538" font-size="19" font-weight="700" fill="#1b2a3a">Data Semantics &amp; Alignment</text>
<text x="128" y="562" font-size="13.5" fill="#33414f">The vocabulary of the source data, and how each</text>
<text x="128" y="581" font-size="13.5" fill="#33414f">source term corresponds to an AML concept.</text>
<rect x="650" y="520" width="468" height="70" rx="7" fill="#ffffff" stroke="#6a4fa3" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="535" font-size="10" font-weight="700" fill="#6a4fa3" letter-spacing="1">EXAMPLE</text>
<text x="660" y="556" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">fcd:fromAccount</text>
<text x="660" y="575" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  rdfs:subPropertyOf  amd:originator</text>
<path d="M79 603 L79 611" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="50" y="612" width="1080" height="94" rx="10" fill="#e4eef3" stroke="#2f6f86" stroke-width="1.8"/>
<rect x="50" y="612" width="58" height="94" rx="10" fill="#2f6f86"/><rect x="90" y="612" width="18" height="94" fill="#2f6f86"/>
<text x="79" y="670.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="128" y="642" font-size="19" font-weight="700" fill="#1b2a3a">OBDA Mapping</text>
<text x="128" y="666" font-size="13.5" fill="#33414f">Maps source tables and columns to the source vocabulary.</text>
<text x="128" y="685" font-size="13.5" fill="#33414f">The only layer that knows the physical schema.</text>
<rect x="650" y="624" width="468" height="70" rx="7" fill="#ffffff" stroke="#2f6f86" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="639" font-size="10" font-weight="700" fill="#2f6f86" letter-spacing="1">EXAMPLE</text>
<text x="660" y="660" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">fcd:fromAccount   ←   column tx.from_account</text>
<text x="660" y="679" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  (R2RML triples map over table tx_features)</text>
<path d="M79 707 L79 749" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="50" y="750" width="1080" height="94" rx="10" fill="#eeeff1" stroke="#6b7280" stroke-width="1.8"/>
<rect x="50" y="750" width="58" height="94" rx="10" fill="#6b7280"/><rect x="90" y="750" width="18" height="94" fill="#6b7280"/>
<text x="79" y="808.0" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="128" y="780" font-size="19" font-weight="700" fill="#1b2a3a">Validation &amp; Execution</text>
<text x="128" y="804" font-size="13.5" fill="#33414f">Builds evidence, applies explicit rules (SHACL + code),</text>
<text x="128" y="823" font-size="13.5" fill="#33414f">returns a verdict and what could not be checked.</text>
<rect x="650" y="762" width="468" height="70" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="660" y="777" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="1">EXAMPLE</text>
<text x="660" y="798" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">[consecutive_legs_connect]</text>
<text x="660" y="817" font-size="12" font-family="Menlo,Consolas,monospace" fill="#1b2a3a" xml:space="preserve">  Consecutive legs must connect</text>
<path d="M32 304 L24 304 L24 702 L32 702" stroke="#2e7d5b" stroke-width="2.2" fill="none"/>
<text transform="translate(14 503.0) rotate(-90)" font-size="12" font-weight="700" fill="#2e7d5b" text-anchor="middle" letter-spacing="1">SEMANTIC AND DATA-ACCESS LAYERS</text>
<text x="1170" y="226" font-size="13" font-weight="700" fill="#4a5561" letter-spacing="1">INSIDE THE BOX, AT QUERY TIME</text>
<text x="1170" y="266" font-size="19" font-weight="700" fill="#1b2a3a">1  Read</text>
<text x="1170" y="292" font-size="13.5" fill="#33414f">the typology, the concepts, the</text><text x="1170" y="311" font-size="13.5" fill="#33414f">requirements, the alignment, the mapping</text>
<path d="M1178 324 L1178 356" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="1170" y="386" font-size="19" font-weight="700" fill="#1b2a3a">2  Rewrite</text>
<text x="1170" y="412" font-size="13.5" fill="#33414f">a question in business concepts becomes</text><text x="1170" y="431" font-size="13.5" fill="#33414f">a question in source terms</text>
<path d="M1178 444 L1178 476" stroke="#4a5561" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="1170" y="506" font-size="19" font-weight="700" fill="#1b2a3a">3  Unfold</text>
<text x="1170" y="532" font-size="13.5" fill="#33414f">source terms become SQL through the</text><text x="1170" y="551" font-size="13.5" fill="#33414f">mapping, run read-only against the source</text>
<path d="M1120 718 L1120 734 L1230 734 L1230 753" stroke="#4a5561" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="1242" y="730" font-size="12" fill="#4a5561" font-style="italic">SQL, read-only</text>
<rect x="1170" y="750" width="400" height="94" rx="12" fill="#f6f8fa" stroke="#6b7280" stroke-width="1.8"/>
<text x="1370.0" y="784" font-size="19" font-weight="700" fill="#1b2a3a" text-anchor="middle">Source data</text>
<text x="1370.0" y="808" font-size="13.5" fill="#33414f" text-anchor="middle">relational tables · stay where they are</text>
<text x="1370.0" y="826" font-size="13.5" fill="#33414f" text-anchor="middle">never copied into a separate store</text>
<path d="M1168 797.0 L1134 797.0" stroke="#4a5561" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="1150.0" y="789.0" font-size="12" fill="#4a5561" font-style="italic" text-anchor="middle">rows</text>
<rect x="50" y="858" width="1520" height="38" rx="9" fill="#f4f7fa" stroke="#234b69" stroke-width="1.2"/>
<text x="800.0" y="883" font-size="16" font-weight="700" fill="#14304a" text-anchor="middle">The model interprets  ·  the semantic layer defines meaning and access  ·  explicit rules decide</text>
</svg>