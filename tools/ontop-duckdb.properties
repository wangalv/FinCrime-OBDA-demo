# Ontop connection to the read-only AML Triage database. Use with: tools/ontop.sh query -m <mapping.ttl> -p tools/ontop-duckdb.properties -q <query.rq>
# Do NOT put "?access_mode=read_only" in the URL: DuckDB JDBC treats it as part of the file name and creates an empty file.
jdbc.url=jdbc:duckdb:../AML Triage Demo/data/features.duckdb
jdbc.driver=org.duckdb.DuckDBDriver
jdbc.user=
jdbc.password=
jdbc.property.duckdb.read_only=true
