# Ontop connection to an in-memory DuckDB. Used for the AML typology (AMLTRIX): the mapping reads the CSVs with read_csv(), no database file.
# Run Ontop from the repository root so that 'vendor/amltrix/...' resolves.
jdbc.url=jdbc:duckdb:
jdbc.driver=org.duckdb.DuckDBDriver
jdbc.user=
jdbc.password=
ontop.inferDefaultDatatype=true
